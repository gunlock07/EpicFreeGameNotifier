name: Epic free game notifications
on:
  schedule:
    # UTC, at minute 0 and 30 to reduce top-of-hour congestion.
    - cron: '10,40 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: epic-free-game-notifier
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Epic promotions and send Discord notifications
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID }}
          DISCORD_ROLE_ID: ${{ vars.DISCORD_ROLE_ID }}
          SKIP_EXISTING_ON_FIRST_RUN: 'false'
        run: python notifier.py
      - name: Persist sent notification IDs
        run: |
          if ! git diff --quiet -- state.json || [ -n "$(git ls-files --others --exclude-standard -- state.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state.json
            git commit -m 'chore: update Epic notification state [skip ci]'
            git pull --rebase origin main
            git push origin main
          fi
